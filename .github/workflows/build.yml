name: Build Tauri App

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: read
      artifacts: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: windows-latest
            args: --target x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v3
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: install frontend dependencies
        shell: bash
        run: pnpm install 2>&1 | tee pnpm_install.log

      - name: Build frontend
        shell: bash
        run: pnpm build 2>&1 | tee pnpm_build.log

      - name: Build Tauri (backend + bundle)
        shell: bash
        run: pnpm tauri build -- --target x86_64-pc-windows-msvc 2>&1 | tee tauri_build.log

      - name: Upload artifacts (exe if present)
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: tauri-app-${{ matrix.platform.os }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

      - name: Upload build logs
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: build-logs
          path: |
            pnpm_install.log
            pnpm_build.log
            tauri_build.log
          retention-days: 30
